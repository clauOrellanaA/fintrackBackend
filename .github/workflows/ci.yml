name: Repository CI
on:
  push:
    branches: [main, dev, qa]
  pull_request:
    branches: [main, dev, qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fintrack_be01_test
          POSTGRES_USER: fintrack_test
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack_test -d fintrack_be01_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://fintrack_test:isolated-test-only@127.0.0.1:5432/fintrack_be01_test
      - run: npm run build
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Codex hooks
        run: python -B -m unittest discover -s .codex/hooks -p "test_*.py" -v
      - name: Validate repository foundation
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md CONTRIBUTING.md .gitignore .env.example docs/architecture.md docs/integration.md; do
            test -s "$file"
          done
          for feature in dashboard transactions budgets reports savings-goals notifications auth users; do
            test -d "src/modules/$feature"
          done
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo 'Environment files must not be tracked.'
            exit 1
          fi
          git diff --check $(git hash-object -t tree /dev/null) HEAD
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
